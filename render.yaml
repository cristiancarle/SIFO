# Blueprint de Render: https://render.com/docs/blueprint-spec
#
# PLAN FREE: el disco del servicio es temporal, por eso usuarios e incendios se guardan en
# una base PostgreSQL externa gratuita (Neon o Supabase) indicada en DATABASE_URL.
# KML, informes y PDF se regeneran solos desde la base cuando faltan.
# La app se duerme tras 15 min sin uso y tarda ~1 min en despertar.
services:
  - type: web
    name: sifo
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # cadena de conexión de Neon/Supabase (postgresql://...?sslmode=require)
      - key: SIFO_SECRET_KEY
        generateValue: true
      - key: SIFO_ADMIN_USUARIO
        value: admin
      - key: SIFO_ADMIN_CLAVE_HASH
        sync: false          # Render la pide al crear el servicio; no queda en el repo
      - key: SIFO_REGISTRO
        value: "1"
