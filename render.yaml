# Blueprint de Render: https://render.com/docs/blueprint-spec
#
# PLAN FREE (para probar): sin disco persistente. Cada redeploy o reinicio BORRA los
# incendios y los usuarios registrados (el admin se vuelve a crear solo al arrancar).
# La app se duerme tras 15 min sin uso y tarda ~1 min en despertar.
#
# Para pasar a producción con datos persistentes: cambiar "plan: free" por "plan: starter"
# y descomentar el bloque "disk".
services:
  - type: web
    name: sifo
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    # disk:
    #   name: sifo-datos
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: SIFO_SECRET_KEY
        generateValue: true
      - key: SIFO_ADMIN_USUARIO
        value: admin
      - key: SIFO_ADMIN_CLAVE_HASH
        sync: false          # Render la pide al crear el servicio; no queda en el repo
      - key: SIFO_REGISTRO
        value: "1"
